name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fdf-test-ci-only
          POSTGRES_DB: fdf_test_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fdf_test_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore private SQL validation artifact
        env:
          NEXT_PUBLIC_SUPABASE_URL_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY_DEV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL_DEV" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY_DEV" ]; then
            echo "::error::Complete SQL validation requires this repository's private artifact credentials. Public fork runs cannot substitute missing SQL or skip mandatory suites."
            exit 1
          fi
          node scripts/restore-ci-sql.mjs
          node scripts/restore-ci-sql-upgrades.mjs
          npm run sql:verify

      - name: Guardrails
        run: npm run guardrails

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test coverage
        run: npm run test:coverage

      - name: Verify races with independent PostgreSQL clients
        env:
          TEST_DATABASE_URL: postgresql://postgres:fdf-test-ci-only@127.0.0.1:5432/fdf_test_concurrency
        run: npm run test:postgres

      - name: Verify tests reject known regressions
        run: node scripts/check-test-mutations.mjs

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn

  e2e-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: groups-shared-app-dev-e2e
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_TARGET_ENV: development
      E2E_BASE_URL: http://127.0.0.1:3001
      APP_URL_DEV: http://127.0.0.1:3001
      NEXT_PUBLIC_APP_URL_DEV: http://127.0.0.1:3001
      NEXT_PUBLIC_SUPABASE_URL_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY_DEV }}
      SUPABASE_SERVICE_ROLE_KEY_DEV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
      NEXT_PUBLIC_SUPABASE_DB_SCHEMA_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_DB_SCHEMA_DEV }}
      SUPABASE_PLAYER_PHOTOS_BUCKET_DEV: ${{ secrets.SUPABASE_PLAYER_PHOTOS_BUCKET_DEV }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_USER_ID: ${{ secrets.E2E_ADMIN_USER_ID }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ORG_SLUG: ${{ secrets.E2E_ORG_SLUG }}
      E2E_ORG_NAME: ${{ secrets.E2E_ORG_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore and verify this commit's canonical SQL
        run: |
          node scripts/restore-ci-sql.mjs
          node scripts/check-private-sql.mjs --canonical-only

      - name: Validate mandatory E2E configuration
        run: npm run test:e2e:preflight

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build and test desktop and mobile
        run: npm run test:e2e

      # This repository is public. Traces/HTML may contain the fixture's login or cookies.
      - name: Upload visual evidence without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            test-results/**/*.png
          if-no-files-found: warn
