name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formation-auth-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    concurrency:
      group: groups-shared-app-dev-e2e
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_TARGET_ENV: development
      E2E_BASE_URL: http://127.0.0.1:3001
      APP_URL_DEV: http://127.0.0.1:3001
      NEXT_PUBLIC_APP_URL_DEV: http://127.0.0.1:3001
      NEXT_PUBLIC_SUPABASE_URL_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY_DEV }}
      SUPABASE_SERVICE_ROLE_KEY_DEV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
      NEXT_PUBLIC_SUPABASE_DB_SCHEMA_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_DB_SCHEMA_DEV }}
      SUPABASE_PLAYER_PHOTOS_BUCKET_DEV: ${{ secrets.SUPABASE_PLAYER_PHOTOS_BUCKET_DEV }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_USER_ID: ${{ secrets.E2E_ADMIN_USER_ID }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ORG_SLUG: ${{ secrets.E2E_ORG_SLUG }}
      E2E_ORG_NAME: ${{ secrets.E2E_ORG_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore and verify this commit's canonical SQL
        run: |
          node scripts/restore-ci-sql.mjs
          node scripts/check-private-sql.mjs --canonical-only

      - name: Validate mandatory E2E configuration
        run: npm run test:e2e:preflight

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium


      - name: Fetch the exact benchmark revisions
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main refs/pull/29/head
          git cat-file -e 'cdec0df373aac409d95aff5f2084a603eef66083^{commit}'
          git cat-file -e '35fb929d2026c856f210283b5083ef76ac8cf078^{commit}'
          git diff --exit-code cdec0df373aac409d95aff5f2084a603eef66083 HEAD -- . ':!.github/workflows/tests.yml' ':!scripts/benchmark-formation-auth.mjs'

      - name: A - Full E2E with main login
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .next
          node scripts/benchmark-formation-auth.mjs prepare main
          npm run test:e2e -- --update-snapshots=none 2>&1 | tee "$RUNNER_TEMP/fdf-ab-main.log"
          git diff --exit-code HEAD -- tests/e2e/visual-baselines

      - name: B - Full E2E with PR 29 session reuse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .next
          node scripts/benchmark-formation-auth.mjs prepare pr
          npm run test:e2e -- --update-snapshots=none 2>&1 | tee "$RUNNER_TEMP/fdf-ab-pr.log"
          git diff --exit-code HEAD -- tests/e2e/visual-baselines

      - name: Verify case and snapshot parity and compare login timings
        run: node scripts/benchmark-formation-auth.mjs compare "$RUNNER_TEMP/fdf-ab-main.log" "$RUNNER_TEMP/fdf-ab-pr.log"
